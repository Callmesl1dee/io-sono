{% extends 'base.html' %}
{% load static %}
{% block title %}Схема зала | IO SONO{% endblock %}
{% block content %}
<section class="hall-section">
    <div class="container">
        <h1 class="page-header__title" style="text-align:center;">Выберите <span class="text-accent">стол</span></h1>
        
        <!-- === SVG СХЕМА ЗАЛА === -->
        <div class="hall-map-svg" style="margin-bottom: 3rem; background: #0f0f0f; border-radius: 20px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 40px rgba(0,0,0,0.4);">
            <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
                <!-- Фоновая картинка зала -->
                <image href="{% static 'images/hall-plan.png' %}" x="0" y="0" width="1000" height="600" style="opacity: 0.95;" />
                
                <!-- Динамические столы -->
                {% for table in tables %}
                <g class="svg-table" data-id="{{ table.id }}" transform="translate({{ table.svg_x }}, {{ table.svg_y }})">
                    {% if table.seats <= 2 %}
                        <circle cx="0" cy="0" r="25" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="4"/>
                        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">{{ table.number }}</text>
                        <circle cx="-18" cy="-18" r="4" fill="#555"/>
                        <circle cx="18" cy="18" r="4" fill="#555"/>
                    {% elif table.seats <= 4 %}
                        <rect x="-30" y="-30" width="60" height="60" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="4" rx="8"/>
                        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">{{ table.number }}</text>
                        <circle cx="-30" cy="-30" r="4" fill="#555"/>
                        <circle cx="30" cy="-30" r="4" fill="#555"/>
                        <circle cx="30" cy="30" r="4" fill="#555"/>
                        <circle cx="-30" cy="30" r="4" fill="#555"/>
                    {% else %}
                        <rect x="-40" y="-35" width="80" height="70" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="4" rx="8"/>
                        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">{{ table.number }}</text>
                        <circle cx="-40" cy="-35" r="4" fill="#555"/>
                        <circle cx="0" cy="-35" r="4" fill="#555"/>
                        <circle cx="40" cy="-35" r="4" fill="#555"/>
                        <circle cx="40" cy="35" r="4" fill="#555"/>
                        <circle cx="0" cy="35" r="4" fill="#555"/>
                        <circle cx="-40" cy="35" r="4" fill="#555"/>
                    {% endif %}
                </g>
                {% endfor %}
            </svg>
        </div>
    </div>
</section>

<!-- ПОПАП -->
<div id="table-popup" class="table-popup">
    <button class="popup-close" onclick="closePopup()">×</button>
    <h3 class="popup-title" id="popup-title">Стол №</h3>
    
    <div class="popup-date-nav">
        <button onclick="changeDate(-1)">‹</button>
        <span id="popup-date-display">Сегодня</span>
        <button onclick="changeDate(1)">›</button>
    </div>

    <div class="popup-slots" id="popup-slots"></div>
    <button id="book-now-btn" class="btn btn--primary" onclick="bookTable()">Забронировать слот</button>
</div>

<script src="{% static 'js/hall.js' %}"></script>
{% endblock %}
