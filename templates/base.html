{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IO SONO | Итальянский ресторан{% endblock %}</title>
    <meta name="description" content="Аутентичная итальянская кухня в центре города">
    
    <!-- Google Fonts: Playfair Display (заголовки) + Inter (текст) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="/" class="logo">IO <span class="logo__accent">SONO</span></a>
            <nav class="nav">
                 <a href="{% url 'core:home' %}" class="nav__link">Главная</a>
                 <a href="{% url 'core:menu' %}" class="nav__link">Меню</a>
                 <a href="{% url 'core:bar_menu' %}" class="nav__link">Бар</a>
                 <a href="{% url 'core:kids_menu' %}" class="nav__link">Детское меню</a>
                 <a href="{% url 'core:reservation' %}" class="nav__link">Бронь</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

        <!-- Копирайт -->
        <div class="copyright">
            <div class="container">
                <p>© Все права защищены 2026 IO SONO</p>
            </div>
        </div>

            <script src="{% static 'js/main.js' %}"></script>
        </body>
        </html>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
