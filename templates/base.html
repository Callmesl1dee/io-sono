{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IO SONO | Итальянский ресторан{% endblock %}</title>
    <meta name="description" content="Аутентичная итальянская кухня в центре города">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="/" class="logo">IO <span class="logo__accent">SONO</span></a>
            
            <nav class="nav">
                <a href="{% url 'core:home' %}" class="nav__link">Главная</a>
                <a href="{% url 'core:menu' %}" class="nav__link">Меню</a>
                <a href="{% url 'core:bar_menu' %}" class="nav__link">Бар</a>
                <a href="{% url 'core:kids_menu' %}" class="nav__link">Детское</a>
                <a href="{% url 'core:reservation' %}" class="nav__link">Бронь</a>

                {% if user.is_authenticated %}
                <div class="user-menu">
                    <button class="user-menu__trigger" type="button">
                        <span class="user-menu__name">👤 {{ user.username }}</span>
                        <span class="user-menu__arrow">▼</span>
                    </button>
                    
                    <div class="user-menu__dropdown">
                        <a href="{% url 'core:profile' %}" class="user-menu__item">
                            <span>📋</span> Мои брони
                        </a>
                        <a href="{% url 'core:loyalty' %}" class="user-menu__item">
                            <span>🎁</span> Бонусы
                        </a>
                        <div class="user-menu__divider"></div>
                        <a href="{% url 'core:logout' %}" class="user-menu__item user-menu__item--danger">
                            <span>🚪</span> Выйти
                        </a>
                    </div>
                </div>
                {% else %}
                    <a href="{% url 'core:login' %}" class="nav__link nav__link--admin">Войти</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="copyright">
        <div class="container">
            <p>© Все права защищены 2026 IO SONO</p>
        </div>
    </div>

    <!-- === МОДАЛЬНОЕ ОКНО === -->
    <div id="dish-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" aria-label="Закрыть">&times;</button>
            
            <div class="modal-image" id="modal-img-container">
                <img id="modal-img" src="" alt="">
            </div>
            
            <div class="modal-body">
                <span class="modal-category" id="modal-category"></span>
                <h2 class="modal-title" id="modal-title"></h2>
                <div class="modal-tags">
                    <span id="modal-volume"></span>
                    <span id="modal-alcohol"></span>
                </div>
                <p class="modal-desc" id="modal-desc"></p>
                <div class="modal-footer">
                    <div class="modal-price" id="modal-price"></div>
                  
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
