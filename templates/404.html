{% extends 'base.html' %}

{% block title %}404 - Страница не найдена{% endblock %}

{% block content %}
<section class="error-section">
    <div class="container">
        <div class="error-content">
            <h1 class="error-title">404</h1>
            <h2 class="error-subtitle">Страница не найдена</h2>
            <p class="error-text">
                Похоже, вы заблудились в лабиринтах нашего ресторана. 
                Не переживайте, мы поможем вам найти дорогу!
            </p>
            <div class="error-actions">
                <a href="{% url 'core:home' %}" class="btn btn--primary">На главную</a>
                <a href="{% url 'core:menu' %}" class="btn btn--outline">Смотреть меню</a>
            </div>
            <div class="error-illustration">
                <span style="font-size: 4rem;">🍝</span>
            </div>
        </div>
    </div>
</section>
{% endblock %}
