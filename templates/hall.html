{% extends 'base.html' %}
{% load static %}
{% block title %}Схема зала | IO SONO{% endblock %}
{% block content %}
<section class="hall-section">
    <div class="container">
        <h1 class="page-header__title" style="text-align:center;">Выберите <span class="text-accent">стол</span></h1>
        
        <!-- === SVG СХЕМА ЗАЛА === -->
        <div class="hall-map-svg" style="margin-bottom: 3rem; background: #0f0f0f; border-radius: 20px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 40px rgba(0,0,0,0.4);">
            <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
                <!-- Фоновая картинка зала -->
                <image href="{% static 'images/hall-plan.png' %}" x="0" y="0" width="1000" height="600" style="opacity: 0.95;" />
                
                {% for table in tables %}
                <g class="svg-table" data-id="{{ table.id }}" data-number="{{ table.number }}" transform="translate({{ table.svg_x }}, {{ table.svg_y }}) rotate({{ table.rotation }})">
                    {% if table.shape_type == 'circle' %}
                        <circle cx="0" cy="0" r="28" />
                    {% elif table.shape_type == 'square' %}
                        <rect x="-32" y="-32" width="64" height="64" rx="8" />
                    {% elif table.shape_type == 'horizontal_rect' %}
                        <rect x="-55" y="-35" width="110" height="70" rx="8" />
                    {% else %}
                        <!-- vertical_rect -->
                        <rect x="-35" y="-55" width="70" height="110" rx="8" />
                    {% endif %}
                </g>
                {% endfor %}
            </svg>
        </div>
    </div>
</section>

<!-- ПОПАП -->
<div id="table-popup" class="table-popup">
    <button class="popup-close" onclick="closePopup()">×</button>
    <h3 class="popup-title" id="popup-title">Стол №</h3>
    
    <div class="popup-date-nav">
        <button onclick="changeDate(-1)">‹</button>
        <span id="popup-date-display">Сегодня</span>
        <button onclick="changeDate(1)">›</button>
    </div>

    <div class="popup-slots" id="popup-slots"></div>
    <button id="book-now-btn" class="btn btn--primary" onclick="bookTable()">Забронировать слот</button>
</div>

<script src="{% static 'js/hall.js' %}"></script>
{% endblock %}
