{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IO SONO | Итальянский ресторан{% endblock %}</title>
    <meta name="description" content="Аутентичная итальянская кухня в центре города">
    
    <!-- Google Fonts: Playfair Display (заголовки) + Inter (текст) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="/" class="logo">IO <span class="logo__accent">SONO</span></a>
            <nav class="nav">
                <a href="#menu" class="nav__link">Меню</a>
                <a href="#about" class="nav__link">О нас</a>
                <a href="/admin/" class="nav__link nav__link--admin">Админка</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <p>© 2026 IO SONO. Дипломный проект.</p>
            <p class="footer__note">Разработано на Django + Vanilla CSS/JS</p>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
